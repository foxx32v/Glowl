name: glowl

services:

  tts:
    image: navatusein/silero-tts-service:latest
    restart: unless-stopped
    ports:
      - "9898:9898"
    env_file: .env
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - glowl

  llm:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    env_file: .env
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - glowl
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  asr:
    image: alphacep/kaldi-ru:latest
    restart: unless-stopped
    ports:
      - "2700:2700"
    env_file: .env
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - glowl

networks:
  glowl:
    driver: bridge

volumes:
  ollama_data: