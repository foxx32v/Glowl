name: Bot test

on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram Message
        uses: cbrgm/telegram-github-action@v1
        with:
          token: ${{ secrets.BOT_TOKEN }}
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          parse-mode: html
          message: |
            <b>Egger-bot</b>
            Опять ${{ github.actor }} закаммитил какую-то хрень

            Репозиторий: <code>${{ github.repository }}</code>
            Ветка: <code>${{ github.ref_name }}</code>
            Сообщение: <code>${{ github.event.head_commit.message }}</code>
            SHA: <code>${{ github.sha }}</code>